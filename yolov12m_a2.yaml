# YOLOv12-M with A2 Attention Only (R_ELAN removed)

nc: 1  # number of classes
depth_multiple: 0.67
width_multiple: 0.75

backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0
  - [-1, 1, Conv, [128, 3, 2]]  # 1
  - [-1, 1, A2, [128]]  # 2
  - [-1, 3, C2f, [128]]  # 3
  - [-1, 1, Conv, [256, 3, 2]]  # 4
  - [-1, 1, A2, [256]]  # 5
  - [-1, 3, C2f, [256]]  # 6
  - [-1, 1, Conv, [512, 3, 2]]  # 7
  - [-1, 1, A2, [512]]  # 8
  - [-1, 3, C2f, [512]]  # 9
  - [-1, 1, Conv, [768, 3, 2]]  # 10
  - [-1, 3, C2f, [768]]  # 11
  - [-1, 1, SPPF, [1024, 5]]  # 12

head:
  - [-1, 1, Conv, [512, 1, 1]]  # 0
  - [-1, 1, nn.Upsample, ['None', 2, 'nearest']]  # 1
  - [[-1, 9], 1, Concat, [1]]  # 2
  - [-1, 1, A2, [1024]]  # 3
  - [-1, 3, C2f, [512]]  # 4
  - [-1, 1, Conv, [256, 1, 1]]  # 5
  - [-1, 1, nn.Upsample, ['None', 2, 'nearest']]  # 6
  - [[-1, 6], 1, Concat, [1]]  # 7
  - [-1, 1, A2, [512]]  # 8
  - [-1, 3, C2f, [256]]  # 9
  - [-1, 1, Conv, [256, 3, 2]]  # 10
  - [[-1, 17], 1, Concat, [1]]  # 11
  - [-1, 3, C2f, [512]]  # 12
  - [-1, 1, Conv, [512, 3, 2]]  # 13
  - [[-1, 12], 1, Concat, [1]]  # 14
  - [-1, 3, C2f, [768]]  # 15
  - [[22, 25, 28], 1, Detect, ['nc']]  # 16
